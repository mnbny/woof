<!doctype html>
<html lang="en" data-theme="coffee">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Woof · Edit token</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css"
      integrity="sha384-UwBu1IAWgb8nYSKlFTAgsMdqElJVcwjO1O31z47tHuvyhJ4rgjfif927I0JH2zI1"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/theme/coffee.css"
      integrity="sha384-qqdGitAgWSmI3kzDMAvw+yitfgYGWMosprlOArCcH00rMG+2PN6XI5fljOEgkaW4"
      crossorigin="anonymous" />
    <style nonce="{{nonce}}">
      /* The prebuilt daisyUI file has no Tailwind utilities. These are the few that the daisyUI patterns below use,
         with Tailwind's values. */
      .flex {
        display: flex;
      }
      .flex-col {
        flex-direction: column;
      }
      .flex-wrap {
        flex-wrap: wrap;
      }
      .items-center {
        align-items: center;
      }
      .justify-end {
        justify-content: flex-end;
      }
      .gap-2 {
        gap: 0.5rem;
      }
      .gap-4 {
        gap: 1rem;
      }
      .gap-6 {
        gap: 1.5rem;
      }
      .w-full {
        width: 100%;
      }
      .flex-1 {
        flex: 1 1 0%;
      }
      .h-full {
        height: 100%;
      }
      .min-h-96 {
        min-height: 24rem;
      }
      .min-h-screen {
        min-height: 100vh;
      }
      .max-w-5xl {
        max-width: 64rem;
      }
      .mx-auto {
        margin-inline: auto;
      }
      .mt-auto {
        margin-top: auto;
      }
      .p-6 {
        padding: 1.5rem;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }
      .text-sm {
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      [hidden] {
        display: none !important;
      }

      /* daisyUI sizes a tab panel from a fixed tabs height. A grid lets the open panel take the height that the card
         leaves, so the editor fills the page. */
      .tabs-fill {
        display: grid;
        grid-template-columns: repeat(2, max-content) 1fr;
        grid-template-rows: auto 1fr;
      }
      .tabs-fill > .tab-content {
        grid-column: 1 / -1;
        grid-row: 2;
        height: auto;
      }

      /* daisyUI has no typography styles, so rendered Markdown gets a minimal set. */
      .markdown > * + * {
        margin-top: 0.75em;
      }
      .markdown h1 {
        font-size: 1.5rem;
        font-weight: 700;
      }
      .markdown h2 {
        font-size: 1.25rem;
        font-weight: 700;
      }
      .markdown h3 {
        font-weight: 700;
      }
      .markdown ul {
        list-style: disc;
        padding-left: 1.5em;
      }
      .markdown ol {
        list-style: decimal;
        padding-left: 1.5em;
      }
      .markdown a {
        text-decoration: underline;
      }
      .markdown blockquote {
        padding-left: 1em;
        border-left: 4px solid var(--color-base-300);
      }
      .markdown code,
      .markdown pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--color-base-200);
        border-radius: var(--radius-field);
      }
      .markdown code {
        padding: 0.1em 0.3em;
      }
      .markdown pre {
        padding: 1em;
        overflow: auto;
      }
      .markdown pre code {
        padding: 0;
      }
    </style>
  </head>
  <body class="bg-base-200">
    <main class="min-h-screen max-w-5xl mx-auto p-6 flex flex-col gap-6">
      <span id="loading" class="loading loading-dots loading-lg"></span>

      <form id="form" class="card card-border bg-base-100 flex-1" hidden>
        <div class="card-body gap-4">
          <div class="breadcrumbs text-sm"><ul id="crumbs"></ul></div>
          <h1 class="card-title font-mono" id="path"></h1>
          <div class="flex flex-wrap gap-2" id="badges"></div>

          <fieldset class="fieldset">
            <legend class="fieldset-legend">Description</legend>
            <input id="description" class="input w-full" autocomplete="off" placeholder="What the token is for" />
            <p class="label">Discovery ranks tokens by their description and tags.</p>
          </fieldset>

          <fieldset class="fieldset">
            <legend class="fieldset-legend">Tags</legend>
            <input id="tags" class="input w-full" autocomplete="off" placeholder="Separate tags with commas" />
            <div class="flex flex-wrap gap-2" id="tag-preview"></div>
          </fieldset>

          <div id="workspace" class="tabs tabs-lift tabs-fill flex-1" hidden>
            <input type="radio" name="view" class="tab" aria-label="Write" checked />
            <div class="tab-content bg-base-100 border-base-300 p-6">
              <div class="flex flex-col gap-2 h-full">
                <textarea id="content" class="textarea w-full flex-1 min-h-96 font-mono" spellcheck="false"></textarea>
                <span class="label" id="count"></span>
              </div>
            </div>
            <input type="radio" name="view" class="tab" aria-label="Preview" />
            <div class="tab-content bg-base-100 border-base-300 p-6">
              <article class="markdown" id="preview"></article>
            </div>
          </div>

          <fieldset id="script" class="fieldset" hidden>
            <legend class="fieldset-legend">Content</legend>
            <div class="mockup-code w-full" id="commands"></div>
            <p class="label">
              The content is in a script file. Click a command to copy it. Woof saves only the description and tags.
            </p>
          </fieldset>

          <div id="error" role="alert" class="alert alert-error alert-soft" hidden><span id="error-text"></span></div>

          <div class="card-actions items-center justify-end mt-auto">
            <span id="dirty" class="badge badge-warning badge-soft" hidden>Unsaved changes</span>
            <span id="shortcut" hidden
              ><kbd class="kbd kbd-sm" id="modifier">Ctrl</kbd> <kbd class="kbd kbd-sm">S</kbd></span
            >
            <button type="button" id="cancel" class="btn btn-ghost">Cancel</button>
            <button type="submit" id="save" class="btn btn-primary">Save</button>
          </div>
        </div>
      </form>

      <div id="done" role="status" class="alert" hidden><span id="done-text"></span></div>

      <div class="toast" id="toast" hidden>
        <div class="alert alert-success"><span>Copied to the clipboard.</span></div>
      </div>
    </main>

    <script nonce="{{nonce}}">
      const $ = id => document.getElementById(id)
      const REFERENCE = /\{\{([A-Za-z0-9_.-]+)\}\}/g
      let state
      let saved
      let timer
      let busy = false

      const post = async (route, body) => {
        const response = await fetch(location.pathname + route, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body ?? {}),
        })
        return { ok: response.ok, data: await response.json() }
      }

      const element = (tag, className, text) => {
        const node = document.createElement(tag)
        if (className) node.className = className
        if (text !== undefined) node.textContent = text
        return node
      }

      const tagList = () =>
        $('tags')
          .value.split(',')
          .map(tag => tag.trim())
          .filter(Boolean)

      const snapshot = () =>
        JSON.stringify([$('description').value.trim(), tagList(), state.editable ? $('content').value : null])

      const refreshDirty = () => {
        const dirty = Boolean(state) && snapshot() !== saved
        $('dirty').hidden = !dirty
        return dirty
      }

      const renderTags = () =>
        $('tag-preview').replaceChildren(
          ...tagList().map(tag => element('span', 'badge badge-primary badge-soft', tag)),
        )

      // References are plain text in the rendered preview, so they become badges without parsing markup.
      const markReferences = root => {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
        const nodes = []
        while (walker.nextNode()) if (walker.currentNode.nodeValue.match(REFERENCE)) nodes.push(walker.currentNode)
        for (const node of nodes) {
          const parts = []
          let last = 0
          for (const match of node.nodeValue.matchAll(REFERENCE)) {
            parts.push(document.createTextNode(node.nodeValue.slice(last, match.index)))
            parts.push(element('span', 'badge badge-sm badge-primary badge-outline font-mono', match[1]))
            last = match.index + match[0].length
          }
          parts.push(document.createTextNode(node.nodeValue.slice(last)))
          node.replaceWith(...parts)
        }
      }

      const preview = async () => {
        const content = $('content').value
        $('count').textContent = `${content.split('\n').length} lines, ${content.length} characters`
        const { data } = await post('preview', { content })
        $('preview').innerHTML = data.html ?? ''
        markReferences($('preview'))
      }

      const showError = text => {
        $('error-text').textContent = text
        $('error').hidden = !text
      }

      const finish = (kind, text) => {
        busy = true
        state = undefined
        $('form').hidden = true
        $('dirty').hidden = true
        $('shortcut').hidden = true
        $('done').className = `alert alert-${kind}`
        $('done-text').textContent = text
        $('done').hidden = false
      }

      const load = async () => {
        const { ok, data } = await post('state')
        $('loading').hidden = true
        if (!ok) return finish('error', data.error)
        state = data
        const segments = state.path.split('.')
        $('crumbs').replaceChildren(...segments.map(segment => element('li', '', segment)))
        $('path').textContent = state.path
        $('badges').replaceChildren(
          element('span', 'badge badge-primary', state.type),
          element('span', 'badge badge-outline', state.where),
          ...(state.kind === 'file' ? [element('span', 'badge badge-ghost font-mono', state.files[0])] : []),
        )
        $('description').value = state.description
        $('tags').value = state.tags.join(', ')
        renderTags()
        if (state.editable) {
          $('workspace').hidden = false
          $('content').value = state.content
          await preview()
        } else {
          $('script').hidden = false
          $('commands').replaceChildren(
            ...state.commands.map(command => {
              const line = element('pre')
              line.dataset.prefix = '$'
              line.title = 'Copy'
              line.append(element('code', '', command))
              line.addEventListener('click', async () => {
                await navigator.clipboard.writeText(command)
                $('toast').hidden = false
                setTimeout(() => ($('toast').hidden = true), 1600)
              })
              return line
            }),
          )
        }
        saved = snapshot()
        $('form').hidden = false
        $('modifier').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl'
        $('shortcut').hidden = false
      }

      const save = async () => {
        if (!state || busy) return
        busy = true
        $('save').replaceChildren(element('span', 'loading loading-spinner'), 'Saving')
        showError('')
        const body = { description: $('description').value, tags: tagList(), version: state.version }
        if (state.editable) body.content = $('content').value
        const { ok, data } = await post('save', body)
        busy = false
        $('save').replaceChildren('Save')
        if (!ok) return showError(data.error)
        finish('success', `${data.summary} You can close this tab.`)
      }

      $('content').addEventListener('input', () => {
        refreshDirty()
        clearTimeout(timer)
        timer = setTimeout(preview, 180)
      })
      $('description').addEventListener('input', refreshDirty)
      $('tags').addEventListener('input', () => {
        renderTags()
        refreshDirty()
      })
      $('content').addEventListener('keydown', event => {
        if (event.key !== 'Tab') return
        event.preventDefault()
        event.target.setRangeText('  ', event.target.selectionStart, event.target.selectionEnd, 'end')
        event.target.dispatchEvent(new Event('input'))
      })
      $('form').addEventListener('submit', event => {
        event.preventDefault()
        save()
      })
      document.addEventListener('keydown', event => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault()
          save()
        }
      })
      $('cancel').addEventListener('click', async () => {
        if (refreshDirty() && !confirm('Discard your changes?')) return
        await post('cancel')
        finish('info', 'Edit cancelled. Nothing was changed. You can close this tab.')
      })
      addEventListener('beforeunload', event => {
        if (state && refreshDirty()) event.preventDefault()
      })

      load()
    </script>
  </body>
</html>
